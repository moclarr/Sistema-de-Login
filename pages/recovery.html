<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/recovery.css">
  <title>Stock System</title>
</head>

<body>
  <div class="grid-container">
    <div class="img-container">
      <img src="./img2.avif" alt="teste">
    </div>

    <form class="input-container">
      <div class="input-area">

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite o seu e-mail">

        <label for="password">New password</label>
        <input type="password" id="new-password" placeholder="Digite a sua nova senha">

        <label for="password">Confirm password</label>
        <input type="password" id="confirm-password" placeholder="Confirme a sua senha">

      </div>

      <div class="show-password">
        <input type="checkbox" id="toggle">
        <label for="toggle">Mostrar senha</label>
      </div>

      <div class="btn-area">
        <button id="btn-recover">Confirmar alteração</button>
      </div>
    </form>
  </div>

  <script src="../scripts/recovery.js"></script>
</body>

</html>
