<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/login.css">
  <title>Stock System</title>
</head>

<body>
  <div class="grid-container">
    <div class="img-container">
      <img src="./img2.avif" alt="teste">
    </div>

    <form class="input-container">
      <div class="input-area">

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Digite o seu usuário">

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite o seu e-mail">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Digite a sua senha">

      </div>

      <div class="show-password">
        <input type="checkbox" id="toggle-login">
        <label for="toggle">Mostrar senha</label>
      </div>

      <div class="btn-area">
        <button id="btn-login">Entrar</button>
        <a href="./register.html">Não tem conta ainda? Crie agora</a>
        <a href="./recovery.html">Esqueceu senha?</a>
      </div>
    </form>
  </div>

  <script src="../scripts/login.js"></script>
</body>

</html>
